<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Native Chemist</title>
  <meta name="description" content="Native Chemist is a chemistry quiz game with levels, timed questions and explanations.">
  <style>
    :root { --bg:#0F1729; --card:#1a2440; --text:#e8ecf8; --muted:#9aa6c4; --accent:#6c7cff; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
    main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
    h1 { margin:0 0 8px; font-size: 2rem; }
    p { color: var(--muted); }
    .card { background:var(--card); border-radius:16px; padding:24px; margin-top:24px; }
    a.btn { display:inline-block; margin-top:8px; padding:12px 20px; background:var(--accent); color:#fff; text-decoration:none; border-radius:10px; font-weight:600; }
    a { color: var(--accent); }
    footer { margin-top:32px; font-size:.9rem; color:var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Native Chemist</h1>
    <p>A chemistry quiz game. Answer timed questions, unlock new levels and learn from the explanations.</p>

    <div class="card">
      <strong>Get the app</strong><br>
      <a class="btn" href="https://play.google.com/store/apps/details?id=com.nagari.nativechemist">Get it on Google Play</a>
    </div>

    <div class="card">
      <strong>Contact</strong>
      <p>Questions or feedback? Email <a href="mailto:salisuaminu615@gmail.com">salisuaminu615@gmail.com</a>.</p>
    </div>

    <footer>&copy; 2026 Salisu Aminu Abdurrahman</footer>
  </main>
</body>
</html>
